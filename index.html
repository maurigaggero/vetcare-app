<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0fb5a0" />
  <title>VetCare - App para dueños de mascotas</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="demo-panel" id="demo"></aside>

  <div class="stage" id="stage">
    <div class="device" id="device">
      <div class="island"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
        </span>
      </div>

      <main class="screen" id="screen"></main>

      <nav class="tabbar glass" id="tabbar"></nav>
      <div class="home-indicator"></div>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet"></div>
      <div class="toast glass" id="toast"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
